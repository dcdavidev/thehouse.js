name: Bug report
description: Report something that does not work as expected.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Search the [existing issues](https://github.com/dcdavidev/thehouse.js/issues) before you open a new one.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see the bug?
      placeholder: |
        1. Run `thehouse`
        2. Choose '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v24.x.x
  - type: input
    id: terminal
    attributes:
      label: Terminal / Shell
      placeholder: Ghostty, iTerm2, Windows Terminal, bash, zsh, ...
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Linux, macOS 15, Windows 11, ...
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else that helps.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the [Code of Conduct](https://github.com/dcdavidev/thehouse.js/blob/main/CODE_OF_CONDUCT.md).
          required: true
